<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - DIGIBANK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .result-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .success-icon {
            font-size: 56px;
            margin-bottom: 20px;
            color: #10b981;
        }
        .detail-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin: 24px 0;
            text-align: left;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="result-card">
        <div class="success-icon">✓</div>
        <h3 class="fw-bold mb-2">{{ title }}</h3>
        <p class="text-muted">Hệ thống máy chủ đã xử lý thành công yêu cầu dịch vụ của quý khách.</p>

        <div class="detail-box">
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Dịch vụ:</span>
                <span class="fw-semibold">{{ service_name }}</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Mã chuẩn chi (Ref ID):</span>
                <span class="font-monospace fw-bold">{{ trans_id }}</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Chủ tài khoản:</span>
                <span class="fw-semibold">{{ customer.full_name }}</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Số dư khả dụng:</span>
                <span class="fw-bold text-success">{{ customer.balance }}</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Trạng thái kết nối HTTP:</span>
                <span class="badge bg-success">200 OK - Phản hồi tức thì</span>
            </div>
        </div>

        <a href="/" class="btn btn-primary px-4 py-2 fw-semibold">Quay Về Trang Chủ</a>
    </div>
</body>
</html>
